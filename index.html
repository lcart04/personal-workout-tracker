<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workout Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffffff;
  --bg2: #f5f5f3;
  --bg3: #efefec;
  --text: #1a1a18;
  --text2: #6b6b67;
  --text3: #9e9e99;
  --border: rgba(0,0,0,0.12);
  --border2: rgba(0,0,0,0.22);
  --rad: 8px;
  --radlg: 12px;
  --accent: #3c34b0;
  --accent-bg: #eeedfe;
  --danger: #a32d2d;
  --danger-bg: #fcebeb;
  --info-bg: #e6f1fb;
  --info: #185fa5;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1e1e1c;
    --bg2: #2a2a28;
    --bg3: #222220;
    --text: #f0efe8;
    --text2: #a8a8a2;
    --text3: #6b6b67;
    --border: rgba(255,255,255,0.1);
    --border2: rgba(255,255,255,0.2);
    --accent: #9f9aef;
    --accent-bg: #26215c;
    --danger: #f09595;
    --danger-bg: #501313;
    --info-bg: #042c53;
    --info: #85b7eb;
  }
}

body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; padding: 2rem 1rem 4rem; }
.container { max-width: 740px; margin: 0 auto; }

/* Header */
.app-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; flex-wrap: wrap; }
.app-header h1 { font-size: 21px; font-weight: 500; flex-shrink: 0; }
.date-lbl { font-size: 13px; color: var(--text2); flex-shrink: 0; }
.day-name-input { flex: 1; min-width: 140px; border: 0.5px solid var(--border); border-radius: var(--rad); padding: 5px 10px; font-size: 13px; color: var(--text); background: var(--bg2); font-family: inherit; outline: none; }
.day-name-input:focus { border-color: var(--border2); }
.day-name-input::placeholder { color: var(--text3); }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 1.25rem; }
.stat { background: var(--bg); border-radius: var(--rad); padding: 10px 14px; border: 0.5px solid var(--border); }
.stat-lbl { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.stat-val { font-size: 20px; font-weight: 500; }
.stat-unit { font-size: 12px; color: var(--text2); font-weight: 400; }

/* Cards */
.workout-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radlg); margin-bottom: .75rem; overflow: hidden; }
.wcard-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; user-select: none; }
.wcard-header:hover { background: var(--bg2); }
.ex-title { flex: 1; border: none; background: transparent; font-size: 15px; font-weight: 500; color: var(--text); outline: none; font-family: inherit; }
.ex-title::placeholder { color: var(--text3); }
.wmeta { display: flex; align-items: center; gap: 6px; }
.badge { font-size: 11px; padding: 3px 8px; border-radius: var(--rad); background: var(--bg2); color: var(--text2); border: 0.5px solid var(--border); white-space: nowrap; }
.chev { background: none; border: none; cursor: pointer; color: var(--text2); padding: 4px; font-size: 16px; transition: transform .2s; line-height: 1; }
.chev.open { transform: rotate(180deg); }
.wbody { border-top: 0.5px solid var(--border); }

/* Notes */
.notes-row { padding: 8px 16px; border-bottom: 0.5px solid var(--border); }
.notes-row textarea { width: 100%; border: none; background: transparent; font-size: 13px; color: var(--text2); font-family: inherit; resize: none; outline: none; line-height: 1.5; }
.notes-row textarea::placeholder { color: var(--text3); }

/* Bar weight row */
.bar-row { display: flex; align-items: center; gap: 10px; padding: 7px 16px; border-bottom: 0.5px solid var(--border); background: var(--bg2); flex-wrap: wrap; }
.bar-row label { font-size: 12px; color: var(--text2); white-space: nowrap; }
.bar-inp { border: 0.5px solid var(--border); border-radius: var(--rad); padding: 4px 8px; font-size: 13px; color: var(--text); background: var(--bg); text-align: center; width: 68px; font-family: inherit; outline: none; }
.bar-inp:focus { border-color: var(--border2); }
.bar-hint { font-size: 11px; color: var(--text3); }

/* Sets table */
.sets-head { display: grid; grid-template-columns: 28px 1fr 56px 88px 88px 32px; gap: 5px; padding: 7px 16px; background: var(--bg2); border-bottom: 0.5px solid var(--border); }
.sets-head span { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; font-weight: 500; text-align: center; }
.sets-head span:nth-child(2) { text-align: left; }
.set-row { display: grid; grid-template-columns: 28px 1fr 56px 88px 88px 32px; gap: 5px; padding: 5px 16px; align-items: center; border-top: 0.5px solid var(--border); }
.set-num { font-size: 13px; font-weight: 500; color: var(--text2); }
.set-inp { border: 0.5px solid var(--border); border-radius: var(--rad); padding: 4px 6px; font-size: 13px; color: var(--text); background: var(--bg); text-align: center; width: 100%; font-family: inherit; outline: none; }
.set-inp:focus { border-color: var(--border2); }
.set-inp::placeholder { color: var(--text3); }
.set-inp.left { text-align: left; }
.tot-cell { font-size: 12px; color: var(--text2); text-align: center; }
.del-set { background: none; border: none; cursor: pointer; color: var(--text3); padding: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.del-set:hover { color: var(--danger); }
.add-set-row { padding: 7px 16px; border-top: 0.5px solid var(--border); }
.add-set-btn { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 6px; font-family: inherit; }
.add-set-btn:hover { color: var(--text); }
.card-foot { display: flex; justify-content: flex-end; padding: 8px 16px; border-top: 0.5px solid var(--border); }
.del-ex { background: none; border: none; cursor: pointer; font-size: 13px; color: var(--text3); display: flex; align-items: center; gap: 4px; font-family: inherit; }
.del-ex:hover { color: var(--danger); }

/* Bottom bar */
.bottom-bar { display: flex; gap: 8px; margin-top: 1.25rem; flex-wrap: wrap; }
.btn { background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--rad); padding: 9px 16px; font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 7px; font-family: inherit; white-space: nowrap; transition: background .15s; }
.btn:hover { background: var(--bg2); }
.btn:active { transform: scale(.98); }
.btn-add { flex: 1; justify-content: center; }
.btn-accent { background: var(--accent-bg); color: var(--accent); border-color: transparent; }
.btn-accent:hover { opacity: .85; background: var(--accent-bg); }
.btn-danger { color: var(--danger); border-color: var(--danger); }
.btn-danger:hover { background: var(--danger-bg); }

/* Modal overlay */
.modal-wrap { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
.modal-wrap.show { display: flex; }
.modal { background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radlg); padding: 24px; max-width: 360px; width: 100%; }
.modal h3 { font-size: 15px; font-weight: 500; margin-bottom: 8px; }
.modal p { font-size: 13px; color: var(--text2); margin-bottom: 18px; line-height: 1.55; }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
.modal-title { font-size: 15px; font-weight: 500; margin-bottom: 16px; }

/* Date range picker in modal */
.range-fields { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.range-fields label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 4px; }
.range-fields input[type=date] { border: 0.5px solid var(--border2); border-radius: var(--rad); padding: 6px 10px; font-size: 13px; color: var(--text); background: var(--bg2); font-family: inherit; outline: none; width: 100%; }
.range-fields input[type=date]:focus { border-color: var(--accent); }
.range-field { flex: 1; min-width: 120px; }

/* Divider */
.section-divider { height: 0.5px; background: var(--border); margin: 1.75rem 0; }

/* History */
.history-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: .75rem; }
.history-hdr h2 { font-size: 16px; font-weight: 500; }
.history-entry { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radlg); padding: 12px 16px; margin-bottom: .5rem; cursor: pointer; transition: background .12s; }
.history-entry:hover { background: var(--bg2); }
.history-entry-hdr { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.history-date { font-size: 13px; font-weight: 500; }
.history-name { font-size: 13px; color: var(--text2); }
.history-meta { font-size: 12px; color: var(--text3); margin-top: 3px; }

/* History detail (read-only) */
.history-detail { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radlg); margin-bottom: .5rem; overflow: hidden; }
.history-detail-hdr { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--bg2); border-bottom: 0.5px solid var(--border); }
.history-detail-title { font-size: 14px; font-weight: 500; }
.history-detail-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
.history-detail-actions { display: flex; align-items: center; gap: 8px; }
.close-detail { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text2); padding: 2px; line-height: 1; }
.close-detail:hover { color: var(--text); }
.ro-exercise { padding: 10px 16px; border-bottom: 0.5px solid var(--border); }
.ro-exercise:last-child { border-bottom: none; }
.ro-ex-name { font-size: 13px; font-weight: 500; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.ro-ex-bar { font-size: 12px; color: var(--text2); font-weight: 400; }
.ro-set { display: grid; grid-template-columns: 28px 1fr 1fr 1fr; gap: 6px; font-size: 12px; color: var(--text2); padding: 3px 0; }
.ro-set-hdr { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text3); margin-bottom: 4px; display: grid; grid-template-columns: 28px 1fr 1fr 1fr; gap: 6px; }

/* Collapsed month groups */
.month-group { margin-bottom: .5rem; }
.month-group-hdr { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: var(--bg2); border: 0.5px solid var(--border); border-radius: var(--rad); cursor: pointer; user-select: none; }
.month-group-hdr:hover { background: var(--bg3); }
.month-group-label { font-size: 13px; font-weight: 500; color: var(--text); }
.month-group-count { font-size: 12px; color: var(--text3); }
.month-group-chev { font-size: 14px; color: var(--text3); transition: transform .2s; }
.month-group-chev.open { transform: rotate(180deg); }
.month-group-entries { display: none; padding-top: 4px; }
.month-group-entries.open { display: block; }

/* Toast */
.toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: var(--rad); font-size: 13px; font-weight: 500; transition: transform .25s ease; pointer-events: none; white-space: nowrap; z-index: 200; }
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 540px) {
  .sets-head, .set-row { grid-template-columns: 26px 1fr 50px 76px 76px 28px; gap: 4px; padding: 5px 10px; }
  .wcard-header { padding: 10px 12px; }
  .bar-row, .notes-row, .add-set-row, .card-foot, .ro-exercise { padding-left: 12px; padding-right: 12px; }
}
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="app-header">
    <h1>Workout log</h1>
    <span class="date-lbl" id="today-date"></span>
    <input class="day-name-input" id="day-name" placeholder="Day name (e.g. Push day, Chest/Triceps…)" />
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat"><div class="stat-lbl">Exercises</div><div class="stat-val" id="stat-ex">0</div></div>
    <div class="stat"><div class="stat-lbl">Total sets</div><div class="stat-val" id="stat-sets">0</div></div>
    <div class="stat"><div class="stat-lbl">Total volume</div><div class="stat-val" id="stat-vol">0 <span class="stat-unit">lbs</span></div></div>
  </div>

  <!-- Workout list -->
  <div id="workout-list"></div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <button class="btn btn-add" onclick="addWorkout()">＋ Add exercise</button>
    <button class="btn btn-accent" onclick="exportTodayXlsx()">&#8595; Export .xlsx</button>
    <button class="btn btn-danger" onclick="openModal('clear-modal')">&#128465; Clear workout</button>
  </div>

  <div class="section-divider"></div>

  <!-- History -->
  <div class="history-hdr">
    <h2>Past workouts</h2>
    <button class="btn btn-accent" style="padding:6px 12px;font-size:12px;" onclick="openModal('range-modal')">&#8595; Bulk export</button>
  </div>
  <div id="history-list"></div>

</div>

<!-- Clear confirm modal -->
<div class="modal-wrap" id="clear-modal">
  <div class="modal">
    <h3>Clear today's workout?</h3>
    <p>This removes all exercises and sets logged today. It cannot be undone.</p>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal('clear-modal')">Cancel</button>
      <button class="btn btn-danger" onclick="confirmClear()">Yes, clear it</button>
    </div>
  </div>
</div>

<!-- Bulk export range modal -->
<div class="modal-wrap" id="range-modal">
  <div class="modal">
    <div class="modal-title">Bulk export by date range</div>
    <div class="range-fields">
      <div class="range-field">
        <label for="range-start">From</label>
        <input type="date" id="range-start" />
      </div>
      <div class="range-field">
        <label for="range-end">To</label>
        <input type="date" id="range-end" />
      </div>
    </div>
    <p style="font-size:12px;color:var(--text3);margin-bottom:16px;">Exports all workouts in the selected range into a single .xlsx file, sorted by date.</p>
    <div class="modal-btns">
      <button class="btn" onclick="closeModal('range-modal')">Cancel</button>
      <button class="btn btn-accent" onclick="runBulkExport()">Export</button>
    </div>
  </div>
</div>

<!-- History detail modal -->
<div class="modal-wrap" id="detail-modal">
  <div class="modal" style="max-width:560px;">
    <div id="detail-content"></div>
    <div class="modal-btns" style="margin-top:16px;">
      <button class="btn" onclick="closeModal('detail-modal')">Close</button>
      <button class="btn btn-accent" id="detail-export-btn">Export .xlsx</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORE_KEY = 'wt-v2';

function loadStore() {
  try { const r = localStorage.getItem(STORE_KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ today, history })); } catch(e) {}
}

const todayKey = new Date().toISOString().slice(0,10);
const store = loadStore();

let today = store && store.today && store.today.date === todayKey
  ? store.today
  : { date: todayKey, dayName: '', workouts: [] };

let history = (store && store.history) ? store.history.filter(h => h.date !== todayKey) : [];

let nextWId = 1000, nextSId = 10000;

/* ---- helpers ---- */
function fmt(n) { return Math.round(n).toLocaleString(); }
function fmtDate(iso) {
  const [y,m,d] = iso.split('-');
  return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
}
function totalVol(w) {
  return w.sets.reduce((a,s) => {
    const b = parseFloat(w.barWeight)||0, add = parseFloat(s.weight)||0, r = parseInt(s.reps)||0;
    return a + (b+add)*r;
  }, 0);
}
function setTotalStr(w, s) {
  const b = parseFloat(w.barWeight)||0, add = parseFloat(s.weight)||0, r = parseInt(s.reps)||0;
  if (!r && !add) return '—';
  return fmt(b+add) + ' lbs';
}
function setCountLbl(w) { return w.sets.length + ' set' + (w.sets.length!==1?'s':''); }
function badgeVol(w) { const v=totalVol(w); return v>0 ? fmt(v)+' lbs' : ''; }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

/* ---- today stats ---- */
function updateStats() {
  const sets = today.workouts.reduce((a,w) => a+w.sets.length, 0);
  const vol = today.workouts.reduce((a,w) => a+totalVol(w), 0);
  document.getElementById('stat-ex').textContent = today.workouts.length;
  document.getElementById('stat-sets').textContent = sets;
  document.getElementById('stat-vol').innerHTML = fmt(vol) + ' <span class="stat-unit">lbs</span>';
}

/* ---- render today ---- */
function render() {
  const list = document.getElementById('workout-list');
  list.innerHTML = '';
  today.workouts.forEach(w => {
    const div = document.createElement('div');
    div.className = 'workout-card';
    const vol = badgeVol(w);
    div.innerHTML = `
      <div class="wcard-header" onclick="toggleW(${w.id})">
        <span style="font-size:17px;color:var(--text2);flex-shrink:0">&#127947;</span>
        <input class="ex-title" placeholder="Exercise name" value="${esc(w.title)}"
          onclick="event.stopPropagation()" onchange="updateTitle(${w.id},this.value)" />
        <div class="wmeta" id="meta-${w.id}">
          <span class="badge">${setCountLbl(w)}</span>
          ${vol ? `<span class="badge">${vol}</span>` : ''}
        </div>
        <button class="chev ${w.open?'open':''}" aria-label="${w.open?'Collapse':'Expand'}">&#8964;</button>
      </div>
      <div class="wbody ${w.open?'':'hidden'}" id="body-${w.id}" style="${w.open?'':'display:none'}">
        <div class="notes-row">
          <textarea rows="2" placeholder="Notes (e.g. tempo, rest time, how it felt…)"
            onchange="updateNotes(${w.id},this.value)">${esc(w.notes)}</textarea>
        </div>
        <div class="bar-row">
          <label for="bar-${w.id}">Bar weight</label>
          <input id="bar-${w.id}" class="bar-inp" type="number" min="0" step="1" placeholder="45"
            value="${w.barWeight!=null&&w.barWeight!=='' ? w.barWeight : ''}"
            oninput="updateBar(${w.id},this.value)" />
          <span style="font-size:12px;color:var(--text2)">lbs</span>
          <span class="bar-hint">Added weight per set — total = bar + added</span>
        </div>
        <div class="sets-head">
          <span>#</span><span style="text-align:left">Variation / note</span>
          <span>Reps</span><span>Added (lbs)</span><span>Total</span><span></span>
        </div>
        ${w.sets.map((s,i) => `
          <div class="set-row">
            <div class="set-num">${i+1}</div>
            <input class="set-inp left" placeholder="e.g. flat" value="${esc(s.exercise)}"
              onchange="updateSet(${w.id},${s.id},'exercise',this.value)" />
            <input class="set-inp" type="number" min="0" step="1" placeholder="—" value="${s.reps}"
              oninput="updateSet(${w.id},${s.id},'reps',this.value)" />
            <input class="set-inp" type="number" min="0" step="2.5" placeholder="—" value="${s.weight}"
              oninput="updateSet(${w.id},${s.id},'weight',this.value)" />
            <div class="tot-cell" id="tot-${w.id}-${s.id}">${setTotalStr(w,s)}</div>
            <button class="del-set" onclick="deleteSet(${w.id},${s.id})" aria-label="Delete set">&#x2715;</button>
          </div>`).join('')}
        <div class="add-set-row">
          <button class="add-set-btn" onclick="addSet(${w.id})">+ Add set</button>
        </div>
        <div class="card-foot">
          <button class="del-ex" onclick="deleteWorkout(${w.id})">&#128465; Remove exercise</button>
        </div>
      </div>`;
    list.appendChild(div);
  });
  updateStats();
  saveStore();
}

function refreshMeta(w) {
  const el = document.getElementById('meta-'+w.id);
  if (el) { const v=badgeVol(w); el.innerHTML=`<span class="badge">${setCountLbl(w)}</span>${v?`<span class="badge">${v}</span>`:''}`; }
  w.sets.forEach(s => { const t=document.getElementById('tot-'+w.id+'-'+s.id); if(t) t.textContent=setTotalStr(w,s); });
  updateStats();
  saveStore();
}

/* ---- today mutations ---- */
function toggleW(id) {
  const w = today.workouts.find(x=>x.id===id); if(!w) return;
  w.open = !w.open;
  const body = document.getElementById('body-'+id);
  const btn = body.previousElementSibling.querySelector('.chev');
  if (w.open) { body.style.display=''; btn.classList.add('open'); }
  else { body.style.display='none'; btn.classList.remove('open'); }
}
function updateTitle(id,v) { const w=today.workouts.find(x=>x.id===id); if(w){w.title=v;refreshMeta(w);} }
function updateNotes(id,v) { const w=today.workouts.find(x=>x.id===id); if(w){w.notes=v;saveStore();} }
function updateBar(id,v) { const w=today.workouts.find(x=>x.id===id); if(w){w.barWeight=v;refreshMeta(w);} }
function updateSet(wid,sid,f,v) {
  const w=today.workouts.find(x=>x.id===wid); if(!w)return;
  const s=w.sets.find(x=>x.id===sid); if(s){s[f]=v;refreshMeta(w);}
}
function addSet(wid) {
  const w=today.workouts.find(x=>x.id===wid); if(!w)return;
  const l=w.sets[w.sets.length-1];
  w.sets.push({id:nextSId++,exercise:l?l.exercise:'',reps:l?l.reps:'',weight:l?l.weight:''});
  render();
}
function deleteSet(wid,sid) {
  const w=today.workouts.find(x=>x.id===wid);
  if(w){w.sets=w.sets.filter(s=>s.id!==sid);render();}
}
function deleteWorkout(id) { today.workouts=today.workouts.filter(w=>w.id!==id); render(); }
function addWorkout() {
  today.workouts.push({id:nextWId++,title:'',notes:'',barWeight:45,open:true,sets:[{id:nextSId++,exercise:'',reps:'',weight:''}]});
  render();
  setTimeout(()=>{ const ins=document.querySelectorAll('.ex-title'); if(ins.length) ins[ins.length-1].focus(); },50);
}
function confirmClear() {
  today.workouts=[];
  document.getElementById('day-name').value='';
  today.dayName='';
  closeModal('clear-modal');
  render();
  showToast('Workout cleared');
}

document.getElementById('day-name').addEventListener('input', e => {
  today.dayName = e.target.value; saveStore();
});

/* ---- save today to history when leaving ---- */
function saveTodayToHistory() {
  if (today.workouts.length === 0) return;
  history = history.filter(h => h.date !== todayKey);
  history.push(JSON.parse(JSON.stringify(today)));
  saveStore();
}
window.addEventListener('beforeunload', saveTodayToHistory);

/* ---- xlsx helpers ---- */
function buildRows(sessions) {
  const rows = [['Date','Day Name','Exercise','Bar (lbs)','Set #','Variation / Note','Reps','Added (lbs)','Total (lbs)','Volume (lbs)']];
  const sorted = [...sessions].sort((a,b) => b.date.localeCompare(a.date));
  sorted.forEach(session => {
    const dateStr = fmtDate(session.date);
    const dayName = session.dayName || '';
    session.workouts.forEach(w => {
      const bar = parseFloat(w.barWeight)||0;
      w.sets.forEach((s,i) => {
        const add = parseFloat(s.weight)||0;
        const reps = parseInt(s.reps)||0;
        const total = bar + add;
        const vol = total * reps;
        rows.push([dateStr, dayName, w.title||'', bar, i+1, s.exercise||'', reps||'', add||'', total||'', vol||'']);
      });
    });
  });
  return rows;
}

function downloadXlsx(rows, filename) {
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [14,14,18,8,6,16,6,10,10,10].map(w=>({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Workouts');
  XLSX.writeFile(wb, filename);
}

function exportTodayXlsx() {
  if (today.workouts.length === 0) { showToast('No exercises to export'); return; }
  const snapshot = JSON.parse(JSON.stringify(today));
  snapshot.dayName = document.getElementById('day-name').value || today.dayName;
  downloadXlsx(buildRows([snapshot]), 'workout-'+todayKey+'.xlsx');
  showToast('Exported workout-'+todayKey+'.xlsx');
}

/* ---- bulk export ---- */
function runBulkExport() {
  const start = document.getElementById('range-start').value;
  const end = document.getElementById('range-end').value;
  if (!start || !end) { showToast('Please select both dates'); return; }
  if (start > end) { showToast('Start date must be before end date'); return; }
  const allSessions = [...history];
  if (today.workouts.length > 0) allSessions.push(JSON.parse(JSON.stringify(today)));
  const inRange = allSessions.filter(s => s.date >= start && s.date <= end);
  if (inRange.length === 0) { showToast('No workouts found in that range'); return; }
  downloadXlsx(buildRows(inRange), 'workouts-'+start+'-to-'+end+'.xlsx');
  closeModal('range-modal');
  showToast('Exported '+inRange.length+' session'+(inRange.length!==1?'s':''));
}

/* ---- history render ---- */
function renderHistory() {
  const list = document.getElementById('history-list');
  list.innerHTML = '';
  if (history.length === 0) {
    list.innerHTML = '<p style="font-size:13px;color:var(--text3);padding:8px 0">No past workouts yet. They\'ll appear here after you log your first session.</p>';
    return;
  }
  const sorted = [...history].sort((a,b) => b.date.localeCompare(a.date));
  const now = new Date(); now.setHours(0,0,0,0);
  const cutoff = new Date(now); cutoff.setDate(cutoff.getDate()-30);
  const cutoffStr = cutoff.toISOString().slice(0,10);
  const recent = sorted.filter(h => h.date >= cutoffStr);
  const older = sorted.filter(h => h.date < cutoffStr);

  recent.forEach(h => list.appendChild(makeHistoryEntry(h)));

  if (older.length > 0) {
    // group by year-month
    const groups = {};
    older.forEach(h => {
      const [y,m] = h.date.split('-');
      const key = y+'-'+m;
      if (!groups[key]) groups[key] = [];
      groups[key].push(h);
    });
    const groupKeys = Object.keys(groups).sort((a,b)=>b.localeCompare(a));
    groupKeys.forEach(key => {
      const [y,m] = key.split('-');
      const label = new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
      const entries = groups[key];
      const grp = document.createElement('div');
      grp.className = 'month-group';
      const gid = 'grp-'+key;
      grp.innerHTML = `
        <div class="month-group-hdr" onclick="toggleGroup('${gid}')">
          <span class="month-group-label">${label}</span>
          <span style="display:flex;align-items:center;gap:8px">
            <span class="month-group-count">${entries.length} workout${entries.length!==1?'s':''}</span>
            <span class="month-group-chev" id="chev-${gid}">&#8964;</span>
          </span>
        </div>
        <div class="month-group-entries" id="${gid}"></div>`;
      list.appendChild(grp);
      const container = document.getElementById(gid);
      entries.forEach(h => container.appendChild(makeHistoryEntry(h)));
    });
  }
}

function toggleGroup(id) {
  const el = document.getElementById(id);
  const chev = document.getElementById('chev-'+id);
  const open = el.classList.toggle('open');
  if (open) chev.classList.add('open'); else chev.classList.remove('open');
}

function makeHistoryEntry(h) {
  const sets = h.workouts.reduce((a,w)=>a+w.sets.length,0);
  const vol = h.workouts.reduce((a,w)=>a+totalVol(w),0);
  const div = document.createElement('div');
  div.className = 'history-entry';
  div.innerHTML = `
    <div class="history-entry-hdr">
      <span class="history-date">${fmtDate(h.date)}</span>
      ${h.dayName ? `<span class="history-name">${esc(h.dayName)}</span>` : ''}
    </div>
    <div class="history-meta">${h.workouts.length} exercise${h.workouts.length!==1?'s':''} &middot; ${sets} set${sets!==1?'s':''} &middot; ${fmt(vol)} lbs</div>`;
  div.addEventListener('click', () => openHistoryDetail(h));
  return div;
}

/* ---- history detail (read-only) ---- */
let detailSession = null;
function openHistoryDetail(h) {
  detailSession = h;
  const content = document.getElementById('detail-content');
  const totalSets = h.workouts.reduce((a,w)=>a+w.sets.length,0);
  const vol = h.workouts.reduce((a,w)=>a+totalVol(w),0);
  let html = `<div style="margin-bottom:14px">
    <div style="font-size:15px;font-weight:500">${fmtDate(h.date)}${h.dayName ? ' — '+esc(h.dayName) : ''}</div>
    <div style="font-size:12px;color:var(--text3);margin-top:3px">${h.workouts.length} exercise${h.workouts.length!==1?'s':''} &middot; ${totalSets} sets &middot; ${fmt(vol)} lbs total</div>
  </div>`;
  h.workouts.forEach(w => {
    const bar = parseFloat(w.barWeight)||0;
    html += `<div style="margin-bottom:14px;padding-bottom:14px;border-bottom:0.5px solid var(--border)">
      <div class="ro-ex-name">${esc(w.title)||'<em style="color:var(--text3)">Unnamed</em>'}
        ${bar ? `<span class="ro-ex-bar">bar: ${bar} lbs</span>` : ''}
      </div>
      ${w.notes ? `<div style="font-size:12px;color:var(--text3);margin-bottom:6px">${esc(w.notes)}</div>` : ''}
      <div class="ro-set-hdr"><span>#</span><span>Variation</span><span>Reps</span><span>Total</span></div>
      ${w.sets.map((s,i) => {
        const total = (parseFloat(w.barWeight)||0)+(parseFloat(s.weight)||0);
        const r = parseInt(s.reps)||0;
        return `<div class="ro-set"><span style="color:var(--text3)">${i+1}</span><span>${esc(s.exercise)||'—'}</span><span>${r||'—'}</span><span>${r&&total ? fmt(total)+' lbs' : '—'}</span></div>`;
      }).join('')}
    </div>`;
  });
  content.innerHTML = html;
  document.getElementById('detail-export-btn').onclick = () => exportHistoryEntry(h);
  openModal('detail-modal');
}

function exportHistoryEntry(h) {
  downloadXlsx(buildRows([h]), 'workout-'+h.date+'.xlsx');
  showToast('Exported workout-'+h.date+'.xlsx');
}

/* ---- init ---- */
document.getElementById('today-date').textContent = fmtDate(todayKey);
document.getElementById('day-name').value = today.dayName || '';

// Pre-fill range modal with sensible defaults
const rangeEnd = new Date(); rangeEnd.setDate(rangeEnd.getDate()-1);
const rangeStart = new Date(); rangeStart.setDate(rangeStart.getDate()-30);
document.getElementById('range-end').value = rangeEnd.toISOString().slice(0,10);
document.getElementById('range-start').value = rangeStart.toISOString().slice(0,10);

render();
renderHistory();
</script>
